# Render Blueprint for deployment
#
# Two deployment modes:
#
# 1. Single-process (default, no Redis): the web service runs uvicorn and
#    runs upload jobs in-process via FastAPI BackgroundTasks. Job state is
#    persisted in a local SQLite file (`backend/data/upload_jobs.db`). If
#    the container restarts mid-upload, in-flight jobs are marked failed
#    on startup so the frontend sees a clear error and the user can retry.
#    To enable durable storage of the SQLite file across deploys, attach
#    a Render Disk to the web service (see disks block below) — otherwise
#    job history resets on each deploy.
#
# 2. Redis + worker (recommended for production): set REDIS_URL on BOTH
#    the web service and the worker service. The web service enqueues
#    jobs onto an RQ queue; the worker service runs them. Worker restarts
#    independently of the web service, so a redeploy of the API doesn't
#    kill in-flight uploads. Provision a Render Key Value (Redis-compatible)
#    instance and copy its URL into REDIS_URL on both services.
#    The `worker` service block below is commented out — uncomment it
#    once you've provisioned Redis and added REDIS_URL.

services:
  # Backend API
  - type: web
    name: zoom-attendance-api
    runtime: python
    buildCommand: apt-get update && apt-get install -y ffmpeg && cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: credentials.json
      - key: GOOGLE_SHARED_DRIVE_ID
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: zoom-attendance-frontend
          type: web
          property: host
      # --- Live Tutor ---
      # Opus 4.8 key for AI drafting (paste this one in the dashboard).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Auto-wired to the bot service's hostname — no URL to look up.
      - key: TUTOR_BOT_BASE_URL
        fromService:
          name: livetutor-bot
          type: web
          property: host
      # Shared secret between backend and bot, generated once (see envVarGroups).
      - fromGroup: livetutor-shared
      # Set REDIS_URL (e.g. from a Render Key Value instance) to enable the
      # worker-mode pipeline. Leave unset to use the SQLite + BackgroundTasks
      # fallback.
      - key: REDIS_URL
        sync: false
      - key: UPLOAD_JOBS_DB
        value: data/upload_jobs.db
    healthCheckPath: /health
    # Optional: persist SQLite job history across deploys. Render Disks
    # only attach to one service, so this is safe to keep on the API.
    disk:
      name: upload-jobs-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  # Upload worker (uncomment once REDIS_URL is configured)
  # - type: worker
  #   name: zoom-attendance-worker
  #   runtime: python
  #   buildCommand: apt-get update && apt-get install -y ffmpeg && cd backend && pip install -r requirements.txt
  #   startCommand: cd backend && python worker.py
  #   envVars:
  #     - key: ZOOM_ACCOUNT_ID
  #       sync: false
  #     - key: ZOOM_CLIENT_ID
  #       sync: false
  #     - key: ZOOM_CLIENT_SECRET
  #       sync: false
  #     - key: GOOGLE_SERVICE_ACCOUNT_FILE
  #       value: credentials.json
  #     - key: GOOGLE_SHARED_DRIVE_ID
  #       sync: false
  #     - key: REDIS_URL
  #       sync: false

  # Frontend
  - type: web
    name: zoom-attendance-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://zoom-attendance-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  # Live Tutor bot (joins meetings). Runs the Zoom Web SDK in headless Chromium,
  # so it ships as a Docker image (the Playwright base image bundles Chromium +
  # WebRTC libs). The only values you paste are the two Zoom Meeting SDK keys and
  # your Google creds — every URL and the shared secret are wired automatically.
  - type: web
    name: livetutor-bot
    runtime: docker
    dockerfilePath: ./bot/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      # From your Zoom "General App" (Meeting SDK enabled): Client ID + Secret.
      - key: ZOOM_MEETING_SDK_KEY
        sync: false
      - key: ZOOM_MEETING_SDK_SECRET
        sync: false
      # Same Google service account the backend uses, for Drive screenshot uploads.
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      # Optional: Drive folder to nest per-session screenshot folders under.
      - key: TUTOR_DRIVE_FOLDER_ID
        sync: false
      # Auto-wired to the backend's hostname — no URL to look up.
      - key: BACKEND_URL
        fromService:
          name: zoom-attendance-api
          type: web
          property: host
      # Same generated shared secret as the backend.
      - fromGroup: livetutor-shared
      # BOT_PUBLIC_BASE_URL is left unset on purpose: the bot reads its own public
      # URL from Render's RENDER_EXTERNAL_URL automatically.

# Generated once, shared by the backend and the bot so they trust each other.
envVarGroups:
  - name: livetutor-shared
    envVars:
      - key: TUTOR_BOT_SHARED_SECRET
        generateValue: true
