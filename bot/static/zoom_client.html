<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Live Tutor — Zoom client</title>
    <!--
      Include the Zoom Web Meeting SDK (Component View) for YOUR SDK version.
      Pin the version you developed your own bot against. Example (replace VERSION):

      <script src="https://source.zoom.us/VERSION/zoom-meeting-embedded-VERSION.min.js"></script>

      The page is served by the bot with COOP/COEP headers so the SDK's
      SharedArrayBuffer works (see app.py). The Zoom CDN supports CORP.
    -->
    <!--
      Vendored into the image at build time (see bot/Dockerfile), served
      same-origin. Loading it from source.zoom.us worked in a browser but
      never defined ZoomMtgEmbedded inside the container, and a page under
      Cross-Origin-Embedder-Policy: require-corp gives a cross-origin
      script several ways to be dropped without a usable error. Same
      origin removes the CDN, CORS and COEP questions together.
    -->
    <!--
      Order matters. The Component View SDK is built against React,
      ReactDOM, Redux and lodash as GLOBALS, not bundled. Without these
      it throws "React is not defined" partway through and never reaches
      its own last line, which is where it assigns window.ZoomMtgEmbedded.
      The symptom is an undefined global with a page that looks fine,
      because a script error does not stop "load" from firing.

      All of these ship inside the same npm tarball the SDK comes from
      (dist/lib/vendor), so they are vendored and version-matched rather
      than pulled from a CDN.
    -->
    <script src="/static/vendor/lib/vendor/react.min.js"></script>
    <script src="/static/vendor/lib/vendor/react-dom.min.js"></script>
    <script src="/static/vendor/lib/vendor/redux.min.js"></script>
    <script src="/static/vendor/lib/vendor/redux-thunk.min.js"></script>
    <script src="/static/vendor/lib/vendor/lodash.min.js"></script>
    <script src="/static/vendor/zoom-meeting-embedded-ES5.min.js"></script>
    <!--
      In-page face watching. MediaPipe face detection is vendored like the
      SDK (see Dockerfile) so every seat on screen can be checked about
      once a second inside this browser, instead of one screenshot at a
      time through Python. If these files are absent the watcher reports
      itself disabled and the screenshot pipeline carries on unchanged.
    -->
    <script src="/static/vendor/mediapipe/face_detection.js"></script>
    <script src="/static/watcher.js"></script>
    <!--
      The camera picture routine: waits for Zoom's Start Video button to be
      pressable, presses it, and reports what it saw. Its own file so the
      logic runs on a plain page under test.
    -->
    <script src="/static/camera_face.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      /* This box, with viewSizes in the SDK init, IS the video decode
         budget. The browser window size is irrelevant to it: the SDK
         renders at these dimensions regardless, which is why shrinking
         the window saved no memory and only pushed tiles off-screen
         where they could not be screenshotted. 640x360 with a 4 tile
         gallery gives 320x180 per tile, far above what face detection
         needs, at a fraction of the decode. */
      #zoom-root { width: 640px; height: 360px; }
      /* Off-screen canvas we render individual users into for capture. */
      #cap-canvas { position: absolute; left: -10000px; top: 0; }
    </style>
  </head>
  <body>
    <div id="zoom-root"></div>
    <canvas id="cap-canvas" width="320" height="180"></canvas>
    <script src="/static/zoom_client.js"></script>
  </body>
</html>
